# Socialy.INK - engagement configuration
# N is per channel, per day. Defaults: 5. Change a number here and every
# future daily run follows it; no other file needs editing.

defaults:
  comments_per_day: 5
  follows_per_day: 5
  target_window_hours: 24        # how fresh a target post must be
  max_author_followers: 50000     # bigger accounts are escalation-skips, logged for a human call
  reply_char_limit_x: 200         # X replies stay under this
  tweet_prep_char_limit: 272      # L-23c: drafting ceiling for tweets + community posts (X hard limit is 280); the ship gate enforces it, counted by script at prep - never eyeball

pacing:
  intra_run_gap_minutes: [2, 6]   # randomized gap between posts in one session
  run_start_jitter_minutes: 120   # daily run start wanders inside its slot
  auto_reply_delay_minutes: [15, 90]

channels:
  x:
    enabled: true
    comments: 5                   # replies to in-lane posts
    follows: 5                    # prefer accounts engaged with that day
  linkedin_page:
    enabled: true
    comments: 5                   # feed posts only; groups are unreachable as a page
    follows: 5                    # pages only, via the page's Manage following
  substack:
    enabled: true
    comments: 5
    follows: 5                    # free subscribes / follows of in-lane publications
  youtube:
    enabled: true
    comments: 5                   # no links in comments (spam filters)
    follows: 5                    # subscribes to channels commented on

safety:
  stop_on_platform_warning: true  # any warning/limit/CAPTCHA ends that channel's run
  never_circumvent_blocks: true
  verify_live_after_post: true    # every post is read back live before it counts
  # L-28 site-error backoff: a platform SITE error ("Something went wrong",
  # no warning attached) is not a warning - do not retry it daily. Cadence:
  # skip the next run entirely, then retry every other day, logged as a
  # standing site issue until a run succeeds. (Substack subscribes failed
  # 3 straight days and Notes 4x in 2 days, 2026-10-23/25, all site
  # errors, zero warnings.) The moment an error arrives WITH a warning,
  # limit message or CAPTCHA, stop_on_platform_warning governs instead.
  site_error_backoff: [skip_next_run, every_other_day]

growth:                            # Phase 6 - growth audit levers (approved 2026-10-23)
  substack_recommendations:        # recommend-first graph, warm contacts only
    - Rock and Turner
    - CappNotes
    - Systematic Strategies
    - Strategitz
    - Stock Market Moods
    - Broad Spectrum Finance
    - The Innermost Loop
    - Tech Trends
  substack_tags: [AI, Artificial Intelligence, Stock Market, Semiconductors, Federal Reserve, Earnings, Technology]
  notes_per_day: 1                 # 1 original Note in the engagement run + restacks with comment
  shorts_per_episode: 1            # vertical 30-60s cut from the episode cards, captions burned in
  youtube_title_search_clause: true  # YouTube titles carry a plain search clause after the episode title
  episode_follow_line: "If this was useful, follow the show - a new episode lands with every piece."
  playlists: [The Rotation, The Scorecard, Era File, Tuition Tuesday, Start Here]
  youtube_playlists:               # created 2026-10-23 (growth session)
    The Rotation: https://www.youtube.com/playlist?list=PLbw5EO8UhqSQ
    Start Here: https://www.youtube.com/playlist?list=PLBVNfb-kK8Do
    Era File: https://www.youtube.com/playlist?list=PLQpTXBSxsijQ
    Tuition Tuesday: https://www.youtube.com/playlist?list=PLRG_vmj1ObdI
    The Scorecard: https://www.youtube.com/playlist?list=PLR98d0mPNSnE
  youtube_shorts:
    ep18: https://youtube.com/shorts/iyobfptxGoY
  youtube_advanced_features: wait_for_channel_history  # Ravi 2026-10-23: NO video selfie or ID verification for the persona. Comment pinning (comments already posted on all 19 videos) and clickable Community links unlock via channel history; pin in a follow-up session once eligibility shows.
  x_communities_test: {start: 2026-10-24, review: 2026-11-06, communities_joined: 2}
  # L-27 community-post rules (2026-10-24): each community gets DISTINCT
  # wording - identical text across communities trips X's duplicate check
  # ("Whoops! You already said that"). Community texts are measured like
  # tweets before handoff: <= tweet_prep_char_limit at prep (ship gate
  # checks COMMUNITY POST blocks), URL counted at t.co length in the
  # poster's own count.
  next_day_quote_post: true        # quote-post yesterday's thread with one fresh line, when the theme allows
  linkedin_follower_milestone: 150 # page newsletter eligibility threshold; invites NEVER used
  apple_podcasts: live             # claimed 2026-10-23, status Available: https://podcasts.apple.com/us/podcast/that70s-da/id6826468869 (Substack link-back Done)
  growth_ledger_in_sunday_report: true   # subs/followers by channel + attributed sources; 4-week cut rule
