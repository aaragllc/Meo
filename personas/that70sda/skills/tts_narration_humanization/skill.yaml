  rationale: 'On 2026-10-18 the user caught the TTS host saying the brand name inconsistently (''that70sday'' one render, ''that70sda'' the next, often an awkward cut) and called it a ''dead giveaway'' of synthetic speech, directing that it must be written phonetically (''that 70s daa''). The root fix was applied across EP2 through EP8 plus the trailer and saved as a standing rule. In parallel the user drove a verified narration humanization method: around 700 milliseconds of real silence between sections, mid-section breaths when any stretch exceeds about 45 seconds, sparse fillers (''hmm'', ''well'', ''ah'') only at real thinking beats, titles never read aloud, and a 60-second listen check with fixed must-haves before shipping. The system generate_podcast skill and its script reference cover spelling out numbers and abbreviations but contain nothing about phonetic brand-name spelling or pacing humanization, and the method is reused on every narrated episode, so it earns a standalone managed skill rather than living only in user-specific memory.'
